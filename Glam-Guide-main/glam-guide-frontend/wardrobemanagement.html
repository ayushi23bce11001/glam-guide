<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Wardrobe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 0 20px;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 30px 20px;
            text-align: center;
            border-radius: 8px;
            margin-top: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            font-weight: 300;
        }

        .category-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }

        .category-btns button {
            background-color: #007bff;
            color: #fff;
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: 500;
        }

        .category-btns button:hover {
            background-color: #0056b3;
        }

        .upload-section {
            text-align: center;
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .upload-section h2 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .upload-section select,
        .upload-section input[type="text"] {
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 100%;
            margin-bottom: 20px;
            display: inline-block;
        }

        .upload-section button {
            background-color: #28a745;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .upload-section button:hover {
            background-color: #218838;
        }

        .wardrobe {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .outfit-card {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s;
        }

        .outfit-card p {
            font-size: 1rem;
            margin-top: 15px;
            font-weight: 500;
        }

        .outfit-card:hover {
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.9rem;
            color: #555;
            padding: 20px 0;
        }

        .table-section {
            margin-top: 50px;
        }

        #outfit-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        #outfit-table th, #outfit-table td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        #outfit-table th {
            background-color: #007bff;
            color: white;
        }
        .back-icon {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px 8px 12px;
            background: rgba(44, 48, 60, 0.92);
            color: #fff;
            border-radius: 999px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.10);
            font-weight: 500;
            font-size: 1.08rem;
            z-index: 1000;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            text-decoration: none;
            border: 1.5px solid #5e72eb;
        }
        .back-icon:hover {
            background: #5e72eb;
            color: #fff;
            box-shadow: 0 4px 16px rgba(31, 38, 135, 0.18);
        }
        .back-icon svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }
        .back-icon span {
            font-family: inherit;
            font-size: 1.08rem;
            letter-spacing: 0.5px;
        }
        /* Hamburger menu styles */
        .nav-menu {
          position: fixed;
          top: 18px;
          left: 18px;
          z-index: 2000;
        }
        .hamburger {
          display: flex;
          flex-direction: column;
          justify-content: center;
          width: 40px;
          height: 40px;
          background: #333;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          align-items: center;
          gap: 5px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.10);
        }
        .hamburger span {
          display: block;
          width: 24px;
          height: 3px;
          background: #fff;
          border-radius: 2px;
          transition: all 0.3s;
        }
        .nav-links {
          display: none;
          flex-direction: column;
          position: absolute;
          top: 48px;
          left: 0;
          background: #fff;
          border-radius: 8px;
          box-shadow: 0 4px 16px rgba(44,48,60,0.12);
          min-width: 140px;
          padding: 10px 0;
        }
        .nav-links a {
          color: #333;
          text-decoration: none;
          padding: 12px 24px;
          font-size: 1.08rem;
          font-weight: 500;
          transition: background 0.2s;
        }
        .nav-links a:hover {
          background: #f4f6f9;
        }
        .nav-links.open {
          display: flex;
        }
        @media (max-width: 700px) {
          header {
            padding: 18px 8px;
            margin-top: 18px;
          }
          header h1 {
            font-size: 1.5rem;
          }
          header p {
            font-size: 1rem;
          }
          .category-btns {
            flex-direction: column;
            gap: 10px;
            margin: 18px 0;
          }
          .category-btns button {
            padding: 10px 0;
            font-size: 1rem;
          }
          .upload-section {
            padding: 18px 8px;
          }
          .upload-section h2 {
            font-size: 1.2rem;
          }
          .wardrobe {
            grid-template-columns: 1fr;
            gap: 12px;
          }
          .outfit-card {
            padding: 12px 6px;
          }
          #outfit-table th, #outfit-table td {
            padding: 6px;
            font-size: 0.95rem;
          }
          .table-section {
            margin-top: 24px;
          }
          .back-icon {
            top: 12px;
            right: 12px;
            font-size: 0.95rem;
            padding: 6px 12px 6px 8px;
          }
        }
        @media (max-width: 400px) {
          .upload-section input, .upload-section select {
            font-size: 0.95rem;
          }
          .nav-links a {
            font-size: 0.98rem;
            padding: 10px 12px;
          }
        }
    </style>
</head>
<body>
    <!-- Hamburger Menu -->
    <nav class="nav-menu">
      <button class="hamburger" id="hamburgerBtn" aria-label="Open navigation menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>
    <a href="services.html" class="back-icon" title="Back to Services">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      <span>Back</span>
    </a>

<header>
    <h1>Virtual Wardrobe</h1>
    <p>Organize Your Outfits by Season</p>
</header>

<div class="category-btns">
    <button onclick="showCategory('all')">All</button>
    <button onclick="showCategory('winter')">Winter</button>
    <button onclick="showCategory('spring')">Spring</button>
    <button onclick="showCategory('summer')">Summer</button>
    <button onclick="showCategory('fall')">Fall</button>
</div>

<div class="upload-section">
    <h2>Enter Outfit Details</h2>
    
    <!-- AI Image Upload & Analysis -->
    <div style="margin-bottom: 20px; text-align: left; background: #fafafa; border: 1.5px dashed #007bff; border-radius: 8px; padding: 20px;">
        <label for="clothing-file" style="font-weight: 600; display: block; margin-bottom: 8px; color: #222;">Upload Clothing Image for AI Analysis:</label>
        <input type="file" id="clothing-file" accept="image/jpeg,image/png,image/webp" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; width: 100%; background: #fff; cursor: pointer;">
        
        <div id="image-preview-container" style="display: none; margin-top: 15px; text-align: center;">
            <img id="image-preview" src="" alt="Clothing Preview" style="max-height: 180px; max-width: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.12); object-fit: cover;">
        </div>
        
        <button type="button" id="analyze-btn" onclick="analyzeClothingWithAI()" style="margin-top: 15px; background: linear-gradient(135deg, #5e72eb 0%, #764ba2 100%); width: 100%; font-weight: 600;">✨ Analyze Clothing with AI</button>
        <div id="ai-status" style="margin-top: 12px; font-weight: 500; font-size: 0.95rem; color: #555; display: none; text-align: center;"></div>
    </div>

    <input type="hidden" id="outfit-image-url">
    
    <input type="text" id="outfit-name" placeholder="Outfit Name (e.g. Winter Wool Sweater)" required>

    <select id="outfit-category" required>
        <option value="">Select Category</option>
        <option value="top">Top (Shirt, T-Shirt, Blouse, Sweater)</option>
        <option value="bottom">Bottom (Jeans, Pants, Skirt, Shorts)</option>
        <option value="outerwear">Outerwear (Jacket, Coat, Blazer)</option>
        <option value="dress">Dress / Jumpsuit</option>
        <option value="footwear">Footwear (Sneakers, Heels, Boots)</option>
        <option value="accessory">Accessory (Bag, Watch, Belt)</option>
        <option value="other">Other</option>
    </select>
    
    <select id="outfit-color" required>
        <option value="">Select Color</option>
        <option value="red">Red</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="black">Black</option>
        <option value="white">White</option>
        <option value="navy">Navy</option>
        <option value="grey">Grey</option>
        <option value="beige">Beige</option>
        <option value="brown">Brown</option>
        <option value="silver">Silver</option>
    </select>

    <select id="outfit-season" required>
        <option value="">Select Season</option>
        <option value="winter">Winter</option>
        <option value="spring">Spring</option>
        <option value="summer">Summer</option>
        <option value="fall">Fall</option>
        <option value="all-season">All-Season</option>
    </select>

    <select id="outfit-material" required>
        <option value="">Select Material</option>
        <option value="silk">Silk</option>
        <option value="wool">Wool</option>
        <option value="cotton">Cotton</option>
        <option value="linen">Linen</option>
        <option value="chiffon">Chiffon</option>
        <option value="velvet">Velvet</option>
        <option value="cashmere">Cashmere</option>
        <option value="denim">Denim</option>
        <option value="leather">Leather</option>
        <option value="polyester">Polyester</option>
    </select>

    <input type="text" id="outfit-pattern" placeholder="Pattern (e.g. solid, striped, floral, plaid)">
    <input type="text" id="outfit-style" placeholder="Style (e.g. casual, formal, sporty, chic, boho)">
    
    <button type="button" onclick="addOutfit()">Add to Wardrobe</button>
</div>

<div class="wardrobe" id="wardrobe">
    <!-- Outfits will be displayed here -->
</div>

<div class="table-section">
    <h2>Outfit Table</h2>
    <table id="outfit-table">
        <thead>
            <tr>
                <th>Image</th>
                <th>Outfit Name</th>
                <th>Category</th>
                <th>Color</th>
                <th>Season</th>
                <th>Material</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dynamic rows will be added here -->
        </tbody>
    </table>
</div>

<footer>
    <p>© 2024 Virtual Wardrobe | All Rights Reserved</p>
</footer>

<script src="api.js"></script>
<script src="wardrobemanagement.js" defer></script>
</body>
